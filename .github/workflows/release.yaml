name: Release

# Releases are driven by the version in packages/headless/package.json, which a
# PR sets with `pnpm changeset version`. After a successful CI run on main this
# workflow tags the merged commit (tag only, never a branch push), publishes to
# npm with provenance over OIDC trusted publishing, and creates the GitHub
# release from the changelog. No secrets are used: GITHUB_TOKEN and OIDC only.
#
# Recovery: dispatch this workflow with `tag` set to an existing vX.Y.Z tag to
# publish that tag's commit (for example after a failed publish).

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v3.0.0). Leave empty to re-run the release for the tip of main."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides what to do and, when needed, pushes the version tag. Pushes the tag
  # ref only; the script contains no branch push.
  prepare:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      github_release: ${{ steps.plan.outputs.github_release }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Validate manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            if ! printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Tag input '$INPUT_TAG' is not a vX.Y.Z version tag."
              exit 1
            fi
          elif [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Without a tag input this workflow must be dispatched from main (got $REF)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.sha }}

      - name: Plan release and tag
        id: plan
        env:
          EXPECT_TAG: ${{ inputs.tag }}
        run: python3 scripts/release_novel.py plan --create-tag --expect-tag "$EXPECT_TAG"

  # Builds the tagged commit and publishes it. The only job with id-token.
  publish:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tagged version
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          actual=$(node -p "require('./packages/headless/package.json').version")
          if [ "$actual" != "$EXPECTED_VERSION" ]; then
            echo "::error::package.json at the tag is $actual but the plan expected $EXPECTED_VERSION."
            exit 1
          fi

      - name: Build package
        run: pnpm --filter @vectorfyco/novel-v3 build

      - name: Publish to npm (OIDC trusted publishing)
        working-directory: packages/headless
        env:
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
        run: npm publish --access public --provenance --tag "$NPM_TAG"

      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "Published @vectorfyco/novel-v3@$VERSION to npm with provenance." >> "$GITHUB_STEP_SUMMARY"

  # Creates the GitHub release from the changelog. Runs when the publish job
  # succeeded or was not needed because the version is already on npm.
  github_release:
    needs: [prepare, publish]
    if: |
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.github_release == 'true' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; nothing to do."
            exit 0
          fi

          python3 scripts/release_novel.py notes "$VERSION" --out "$RUNNER_TEMP/release-notes.md"

          args=("$TAG" --verify-tag --title "$TAG")
          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            args+=(--notes-file "$RUNNER_TEMP/release-notes.md")
          else
            args+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
          echo "Created GitHub release $TAG." >> "$GITHUB_STEP_SUMMARY"
